<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<body>
<article class="cat-profile" th:fragment="profile(cat)" th:attr="aria-labelledby=${'cat-name-' + cat.id}">
    <a class="cat-photo" th:href="@{/cats/{id}(id=${cat.id})}" th:attr="aria-label=${'認識' + cat.name}">
        <img th:src="@{${cat.imagePath}}" th:alt="${cat.imageAlt}" width="800" height="1000" loading="lazy">
        <span class="cat-photo-overlay" aria-hidden="true"><span>認識牠的日常</span><span>↗</span></span>
    </a>
    <div class="cat-heading">
        <h3 th:id="${'cat-name-' + cat.id}"><a th:href="@{/cats/{id}(id=${cat.id})}" th:text="${cat.name}">浪浪名字</a></h3>
        <span class="cat-status" th:text="${cat.status}">目前狀態</span>
    </div>
    <p class="cat-meta"><span th:text="${cat.age + ' / ' + cat.gender}">年齡 / 性別</span><span th:text="${cat.location}">地區</span></p>
    <a class="cat-story-link" th:href="@{/cats/{id}(id=${cat.id})}" th:attr="aria-label=${'看看' + cat.name + '的故事'}">看看牠的故事 <span aria-hidden="true">→</span></a>
</article>
</body>
</html>
